# General
set -g mouse on
set-window-option -g mode-keys vi

# C-h/j/k/l pane navigation comes from the vim-tmux-navigator plugin (below).
# C-l is taken for navigation, so use <prefix> C-l to clear the screen
bind-key C-l send-keys 'C-l'

# Vim-style splits (matches Neovim's <C-w>v / <C-w>s), opening in the current dir
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind S choose-tree -Zs  # session picker (was <prefix> s)

# Catppuccin theme options (must be set before the plugin loads)
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"

# Status bar
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}"

# Plugins (<prefix> I install, <prefix> U update, <prefix> M-u clean)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.0'

# Initialize TPM (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
